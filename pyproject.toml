[project]
name = "rocketreach-xmail-outreach"
version = "0.1.0"
description = "App para gestionar campañas de outreach con RocketReach y Tencent Xmail"
authors = [
    {name = "Maria Camila Salazar",email = "camilasala0928@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.15.16"
black = "^26.5.1"
notebook = "^7.5.7"
ipykernel = "^7.3.0"
httpx = "^0.28.1"
pandas = "^3.0.3"

[tool.poetry]
packages = [{ include = "outreach_app", from = "src" }]
